<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Staff Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-white/10 backdrop-blur rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20">
        <i class="fas fa-clipboard-user text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Attendance System</h1>
      <p class="text-blue-200 text-sm mt-1">HQ Office & Branches</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-slate-800 mb-6 text-center">Sign in to your account</h2>

      <div id="loginError" class="hidden mb-4 p-3 bg-rose-50 text-rose-700 rounded-xl text-sm"></div>

      <form id="loginForm" class="space-y-5" onsubmit="return handleLogin(event)">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="username" required autocomplete="username"
              class="w-full border border-slate-300 rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              placeholder="Enter username" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="password" required autocomplete="current-password"
              class="w-full border border-slate-300 rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              placeholder="Enter password" />
            <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i id="eyeIcon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/25">
          <i class="fas fa-sign-in-alt mr-2"></i> Sign In
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-xs text-slate-500 text-center mb-3">Demo accounts</p>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <button type="button" onclick="fillDemo('admin','admin123')" class="p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-slate-600 transition">
            <div class="font-semibold text-slate-800">Admin</div>
            <div class="text-slate-400">admin / admin123</div>
          </button>
          <button type="button" onclick="fillDemo('hr','hr123')" class="p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-slate-600 transition">
            <div class="font-semibold text-slate-800">HR</div>
            <div class="text-slate-400">hr / hr123</div>
          </button>
          <button type="button" onclick="fillDemo('staff1','staff123')" class="p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-slate-600 transition">
            <div class="font-semibold text-slate-800">Staff</div>
            <div class="text-slate-400">staff1 / staff123</div>
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-blue-200/60 text-xs mt-6">Secure role-based access · HQ & Branches</p>
  </div>

  <script src="auth.js"></script>
  <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      seedUsersIfEmpty();
      const session = getSession();
      if (session) {
        redirectByRole(session.role);
      }
    });

    function fillDemo(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      const result = login(username, password);
      if (result.success) {
        redirectByRole(result.user.role);
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.remove('hidden');
      }
      return false;
    }

    function redirectByRole(role) {
      if (role === 'admin' || role === 'hr') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
